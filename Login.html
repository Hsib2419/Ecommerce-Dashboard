<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Shop Admin</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }

        body { font-family: 'Segoe UI', sans-serif; }

        /* Animated gradient background */
        .bg-animated {
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 30%, #0e7490 60%, #164e63 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating circles decoration */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-20px); }
        }

        /* Card */
        .auth-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }

        /* Dark mode card */
        body.dark .auth-card {
            background: rgba(15,23,42,0.97);
            color: #f1f5f9;
        }
        body.dark .input-field {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
        }
        body.dark .input-field::placeholder { color: #475569; }
        body.dark .input-icon { color: #475569; }
        body.dark .label-text { color: #94a3b8; }
        body.dark .divider-line { border-color: #334155; }
        body.dark .divider-text { color: #475569; background: #0f172a; }
        body.dark .social-btn { background: #1e293b; border-color: #334155; color: #f1f5f9; }
        body.dark .social-btn:hover { background: #334155; }
        body.dark .switch-text { color: #94a3b8; }
        body.dark .forgot-link { color: #38bdf8; }
        body.dark .tab-inactive { color: #475569; }
        body.dark .sub-text { color: #64748b; }
        body.dark #darkToggle { background: #1e293b; border-color: #334155; color: #94a3b8; }

        /* Input */
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            width: 18px;
            height: 18px;
        }
        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        .input-field {
            width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px 12px 44px;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            color: #1e293b;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #0891b2; background: white; }

        /* Tabs */
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s;
        }
        .auth-tab.active { background: #0891b2; color: white; box-shadow: 0 4px 12px rgba(8,145,178,0.35); }
        .tab-inactive { color: #94a3b8; }

        /* Button */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #0891b2, #0e7490);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(8,145,178,0.4);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(8,145,178,0.5); }
        .btn-primary:active { transform: translateY(0); }

        /* Social buttons */
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            color: #374151;
        }
        .social-btn:hover { border-color: #0891b2; color: #0891b2; transform: translateY(-1px); }

        /* Strength bar */
        .strength-bar { height: 4px; border-radius: 99px; transition: all 0.3s; }

        /* Error shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s ease; }

        /* Success checkmark */
        .success-ring {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body class="bg-animated relative overflow-hidden flex items-center justify-center min-h-screen p-4">

    <!-- Decorative circles -->
    <div class="circle w-64 h-64 -top-16 -left-16" style="animation-delay:0s"></div>
    <div class="circle w-48 h-48 top-1/3 -right-12" style="animation-delay:2s"></div>
    <div class="circle w-32 h-32 bottom-10 left-1/4" style="animation-delay:4s"></div>
    <div class="circle w-20 h-20 bottom-1/3 right-1/4" style="animation-delay:1s"></div>

    <!-- Dark mode toggle -->
    <button id="darkToggle" onclick="toggleDark()"
        class="absolute top-5 right-5 flex items-center gap-2 bg-white/20 text-white border border-white/30 px-4 py-2 rounded-full text-sm font-medium backdrop-blur hover:bg-white/30 transition z-10">
        <i data-lucide="moon" id="darkIcon" class="w-4 h-4"></i>
        <span id="darkText">Dark Mode</span>
    </button>

    <!-- Auth Card -->
    <div class="auth-card relative z-10">

        <!-- Brand -->
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-cyan-600 p-2.5 rounded-xl">
                <i data-lucide="shopping-bag" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800 leading-none" id="brandTitle">E-Shop Admin</h1>
                <p class="text-xs text-gray-400 mt-0.5 sub-text">Welcome back! 👋</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-1 bg-gray-100 p-1 rounded-xl mb-6" id="tabBar" style="background:#f1f5f9">
            <div class="auth-tab active" id="loginTab" onclick="showTab('login')">Login</div>
            <div class="auth-tab tab-inactive" id="signupTab" onclick="showTab('signup')">Sign Up</div>
        </div>

        <!-- ── LOGIN FORM ── -->
        <div id="loginForm">
            <div class="mb-4">
                <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Email Address</label>
                <div class="input-wrap">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input id="loginEmail" type="email" placeholder="admin@eshop.com" class="input-field">
                </div>
            </div>
            <div class="mb-2">
                <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Password</label>
                <div class="input-wrap">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input id="loginPass" type="password" placeholder="••••••••" class="input-field" style="padding-right:44px">
                    <i data-lucide="eye" class="eye-icon" onclick="togglePass('loginPass', this)"></i>
                </div>
            </div>
            <div class="flex justify-end mb-5">
                <a href="#" class="forgot-link text-cyan-600 text-sm font-medium hover:underline">Forgot password?</a>
            </div>

            <p id="loginError" class="text-red-500 text-sm mb-3 hidden text-center font-medium"></p>

            <button class="btn-primary mb-4" onclick="handleLogin()">
                Login to Dashboard
            </button>

            <!-- Divider -->
            <div class="relative flex items-center mb-4">
                <div class="flex-1 border-t-2 divider-line border-gray-100"></div>
                <span class="divider-text px-3 text-xs text-gray-400 bg-white">or continue with</span>
                <div class="flex-1 border-t-2 divider-line border-gray-100"></div>
            </div>

            <!-- Social -->
            <div class="flex gap-3">
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </button>
            </div>
        </div>

        <!-- ── SIGNUP FORM ── -->
        <div id="signupForm" class="hidden">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">First Name</label>
                    <div class="input-wrap">
                        <i data-lucide="user" class="input-icon"></i>
                        <input id="signupFirst" type="text" placeholder="" class="input-field">
                    </div>
                </div>
                <div>
                    <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Last Name</label>
                    <div class="input-wrap">
                        <i data-lucide="user" class="input-icon"></i>
                        <input id="signupLast" type="text" placeholder="" class="input-field">
                    </div>
                </div>
            </div>
            <div class="mb-4">
                <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Email Address</label>
                <div class="input-wrap">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input id="signupEmail" type="email" placeholder="" class="input-field">
                </div>
            </div>
            <div class="mb-2">
                <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Password</label>
                <div class="input-wrap">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input id="signupPass" type="password" placeholder="" class="input-field" oninput="checkStrength(this.value)" style="padding-right:44px">
                    <i data-lucide="eye" class="eye-icon" onclick="togglePass('signupPass', this)"></i>
                </div>
                <!-- Strength meter -->
                <div class="flex gap-1.5 mt-2">
                    <div class="strength-bar flex-1 bg-gray-200" id="s1"></div>
                    <div class="strength-bar flex-1 bg-gray-200" id="s2"></div>
                    <div class="strength-bar flex-1 bg-gray-200" id="s3"></div>
                    <div class="strength-bar flex-1 bg-gray-200" id="s4"></div>
                </div>
                <p id="strengthText" class="text-xs mt-1 text-gray-400"></p>
            </div>
            <div class="mb-4">
                <label class="label-text block text-sm font-semibold text-gray-600 mb-1.5">Confirm Password</label>
                <div class="input-wrap">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input id="signupConfirm" type="password" placeholder="" class="input-field" style="padding-right:44px">
                    <i data-lucide="eye" class="eye-icon" onclick="togglePass('signupConfirm', this)"></i>
                </div>
            </div>

            <!-- Terms -->
            <label class="flex items-start gap-2 mb-4 cursor-pointer">
                <input type="checkbox" id="termsCheck" class="mt-1 accent-cyan-600">
                <span class="text-sm text-gray-500 switch-text">I agree to the <a href="#" class="text-cyan-600 font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-cyan-600 font-semibold hover:underline">Privacy Policy</a></span>
            </label>

            <p id="signupError" class="text-red-500 text-sm mb-3 hidden text-center font-medium"></p>

            <button class="btn-primary" onclick="handleSignup()">
                Create Account
            </button>
        </div>

        <!-- Success screen (hidden) -->
        <div id="successScreen" class="hidden text-center py-4">
            <div class="success-ring">
                <i data-lucide="check" class="w-8 h-8 text-green-600"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2" id="successTitle">Welcome back!</h2>
            <p class="text-gray-500 text-sm mb-6" id="successMsg">Redirecting to dashboard...</p>
            <div class="w-full bg-gray-100 rounded-full h-1.5">
                <div id="progressBar" class="bg-cyan-600 h-1.5 rounded-full transition-all duration-100" style="width:0%"></div>
            </div>
        </div>

        <!-- Bottom switch text -->
        <p class="text-center text-sm text-gray-400 switch-text mt-5" id="switchText">
            Don't have an account?
            <a href="#" class="text-cyan-600 font-bold hover:underline" onclick="showTab('signup'); return false;">Sign up free</a>
        </p>
    </div>

    <script>
        lucide.createIcons();

        // Demo credentials
        const DEMO = { email: "admin@eshop.com", password: "admin123" };

        function showTab(tab) {
            const isLogin = tab === "login";
            document.getElementById("loginForm").classList.toggle("hidden", !isLogin);
            document.getElementById("signupForm").classList.toggle("hidden", isLogin);
            document.getElementById("successScreen").classList.add("hidden");

            document.getElementById("loginTab").classList.toggle("active", isLogin);
            document.getElementById("loginTab").classList.toggle("tab-inactive", !isLogin);
            document.getElementById("signupTab").classList.toggle("active", !isLogin);
            document.getElementById("signupTab").classList.toggle("tab-inactive", isLogin);

            document.getElementById("switchText").innerHTML = isLogin
                ? `Don't have an account? <a href="#" class="text-cyan-600 font-bold hover:underline" onclick="showTab('signup'); return false;">Sign up free</a>`
                : `Already have an account? <a href="#" class="text-cyan-600 font-bold hover:underline" onclick="showTab('login'); return false;">Login</a>`;

            document.querySelector(".sub-text").textContent = isLogin ? "Welcome back! 👋" : "Create your account 🚀";
            clearErrors();
        }

        function clearErrors() {
            ["loginError","signupError"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
                document.getElementById(id).textContent = "";
            });
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.remove("hidden");
            el.closest(".auth-card") && el.closest(".auth-card").classList.add("shake");
            setTimeout(() => el.closest(".auth-card") && el.closest(".auth-card").classList.remove("shake"), 400);
        }

        function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const pass  = document.getElementById("loginPass").value;
            if (!email || !pass) { showError("loginError", "⚠️ Please fill in all fields"); return; }
            if (!email.includes("@")) { showError("loginError", "⚠️ Enter a valid email"); return; }
            if (email !== DEMO.email || pass !== DEMO.password) {
                showError("loginError", "❌ Wrong email or password. Try: admin@eshop.com / admin123");
                return;
            }
            showSuccess("Login Successful! 🎉", "Redirecting to dashboard...", "index.html");
        }

        function handleSignup() {
            const first   = document.getElementById("signupFirst").value.trim();
            const last    = document.getElementById("signupLast").value.trim();
            const email   = document.getElementById("signupEmail").value.trim();
            const pass    = document.getElementById("signupPass").value;
            const confirm = document.getElementById("signupConfirm").value;
            const terms   = document.getElementById("termsCheck").checked;

            if (!first || !last || !email || !pass || !confirm) { showError("signupError", "⚠️ Please fill in all fields"); return; }
            if (!email.includes("@")) { showError("signupError", "⚠️ Enter a valid email"); return; }
            if (pass.length < 6) { showError("signupError", "⚠️ Password must be at least 6 characters"); return; }
            if (pass !== confirm) { showError("signupError", "❌ Passwords do not match"); return; }
            if (!terms) { showError("signupError", "⚠️ Please accept the Terms of Service"); return; }

            showSuccess(`Account Created! 🎉`, `Welcome, ${first}! Redirecting...`, "index.html");
        }

        function showSuccess(title, msg, redirect) {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("signupForm").classList.add("hidden");
            document.getElementById("successScreen").classList.remove("hidden");
            document.getElementById("switchText").classList.add("hidden");
            document.getElementById("tabBar").classList.add("hidden");
            document.getElementById("successTitle").textContent = title;
            document.getElementById("successMsg").textContent   = msg;
            lucide.createIcons();

            let progress = 0;
            const bar = document.getElementById("progressBar");
            const iv  = setInterval(() => {
                progress += 2;
                bar.style.width = progress + "%";
                if (progress >= 100) { clearInterval(iv); window.location.href = redirect; }
            }, 50);
        }

        // Password visibility toggle
        function togglePass(inputId, iconEl) {
            const input = document.getElementById(inputId);
            const isPass = input.type === "password";
            input.type = isPass ? "text" : "password";
            iconEl.setAttribute("data-lucide", isPass ? "eye-off" : "eye");
            lucide.createIcons();
        }

        // Password strength
        function checkStrength(val) {
            const bars  = ["s1","s2","s3","s4"].map(id => document.getElementById(id));
            const texts = ["", "Weak 😟", "Fair 😐", "Good 👍", "Strong 💪"];
            const colors = ["bg-red-400", "bg-orange-400", "bg-yellow-400", "bg-green-500"];

            let score = 0;
            if (val.length >= 6) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            bars.forEach((b, i) => {
                b.className = "strength-bar flex-1 " + (i < score ? colors[score - 1] : "bg-gray-200");
            });
            document.getElementById("strengthText").textContent = val.length ? texts[score] : "";
        }

        // Dark mode
        function toggleDark() {
            const isDark = document.body.classList.toggle("dark");
            document.getElementById("darkIcon").setAttribute("data-lucide", isDark ? "sun" : "moon");
            document.getElementById("darkText").textContent = isDark ? "Light Mode" : "Dark Mode";
            const btn = document.getElementById("darkToggle");
            btn.style.background = isDark ? "rgba(30,41,59,0.8)" : "rgba(255,255,255,0.2)";
            lucide.createIcons();
        }
    </script>
</body>
</html>
