<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - E-Shop Admin</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, main, aside, div, section, button, img { transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
        body.dark { background-color: #0f172a; }
        body.dark main { background-color: #0f172a; color: #f1f5f9; }
        body.dark aside { background-color: #020617; }
        body.dark .top-nav { background-color: #1e293b; }
        body.dark .page-card { background-color: #1e293b; }
        body.dark .stat-card { background-color: #1e293b; }
        body.dark .stat-card h3 { color: #94a3b8; }
        body.dark .stat-value { color: #f1f5f9; }
        body.dark thead th { color: #94a3b8; }
        body.dark tbody td { color: #e2e8f0; }
        body.dark tbody tr:hover { background-color: #273344; }
        body.dark .cust-name { color: #f1f5f9; }
        body.dark .cust-email { color: #94a3b8; }
        body.dark #darkModeBtn { background-color: #334155; }
        body.dark #darkModeBtn:hover { background-color: #475569; }
        body.dark .search-wrap { border-color: #475569; }
        body.dark .search-wrap input { color: #f1f5f9; }
        body.dark .search-wrap input::placeholder { color: #64748b; }

        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; margin-bottom: 6px; font-size: 1.05rem; font-weight: 600; transition: background 0.2s, transform 0.15s; }
        .nav-link:hover { background-color: rgba(255,255,255,0.18); transform: scale(1.04); }
        .nav-link.active { background-color: rgba(255,255,255,0.25); }
        .nav-link svg { flex-shrink: 0; width: 20px; height: 20px; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-vip      { background: #ede9fe; color: #6d28d9; }
        .badge-regular  { background: #dbeafe; color: #1d4ed8; }
        .badge-new      { background: #dcfce7; color: #15803d; }
        body.dark .badge-vip     { background: #2e1065; color: #c4b5fd; }
        body.dark .badge-regular { background: #1e3a5f; color: #93c5fd; }
        body.dark .badge-new     { background: #14532d; color: #86efac; }

        .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }
    </style>
</head>
<body class="flex min-h-screen bg-gray-200">

    <!-- SIDEBAR -->
    <aside class="bg-cyan-600 text-white w-64 p-6 flex flex-col min-h-screen">
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-white/20 p-2 rounded-xl"><i data-lucide="shopping-bag" class="w-7 h-7 text-white"></i></div>
            <h1 class="text-2xl font-bold leading-tight">E-Shop<br><span class="text-cyan-200 text-sm font-medium tracking-widest uppercase">Admin</span></h1>
        </div>
        <nav class="flex-1">
            <a href="index.html"     class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="orders.html"    class="nav-link"><i data-lucide="shopping-cart"></i> Orders</a>
            <a href="products.html"  class="nav-link"><i data-lucide="package"></i> Products</a>
            <a href="customers.html" class="nav-link active"><i data-lucide="users"></i> Customers</a>
            <a href="settings.html"  class="nav-link"><i data-lucide="settings"></i> Settings</a>
        </nav>
        <div class="mt-6 pt-4 border-t border-white/20 flex items-center gap-3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsZBVLzCNEWIPOv-p3sDy7G5QAnzHVoFlhwg&s" alt="Profile" class="w-9 h-9 rounded-full border-2 border-white/40">
            <div><p class="text-sm font-semibold leading-none">Admin User</p><p class="text-xs text-cyan-200 mt-0.5">admin@eshop.com</p></div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-6 bg-white">
        <nav class="top-nav flex justify-between items-center p-4 rounded-xl shadow-lg mb-6">
            <div class="flex items-center gap-2 text-gray-500">
                <i data-lucide="home" class="w-4 h-4"></i><span class="text-sm">Home</span>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                <span class="text-sm font-semibold text-cyan-600">Customers</span>
            </div>
            <div class="flex items-center gap-6">
                <button id="darkModeBtn" class="flex items-center gap-2 bg-cyan-600 text-white px-5 py-2.5 rounded-3xl shadow-lg hover:bg-cyan-800 transition duration-300 hover:scale-105 text-sm font-medium">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                    <span id="darkModeBtnText">Dark Mode</span>
                </button>
                <div class="relative text-gray-700">
                    <i data-lucide="bell" class="w-7 h-7"></i>
                    <span class="absolute -top-1 -right-1 bg-cyan-500 w-2.5 h-2.5 rounded-full border-2 border-white"></span>
                </div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsZBVLzCNEWIPOv-p3sDy7G5QAnzHVoFlhwg&s" alt="Profile" class="w-10 h-10 rounded-full">
            </div>
        </nav>

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold">Customers</h1>
                
            </div>
            <button class="flex items-center gap-2 bg-cyan-600 text-white px-5 py-2.5 rounded-xl hover:bg-cyan-700 transition hover:scale-105 font-medium shadow">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Add Customer
            </button>
        </div>

        <!-- Stat Cards -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-card bg-white p-5 rounded-xl shadow-lg hover:scale-105 transition flex items-center gap-4">
                <div class="bg-cyan-100 p-3 rounded-xl"><i data-lucide="users" class="w-6 h-6 text-cyan-600"></i></div>
                <div><h3 class="text-gray-500 text-sm">Total</h3><p class="stat-value font-bold text-2xl">890</p></div>
            </div>
            <div class="stat-card bg-white p-5 rounded-xl shadow-lg hover:scale-105 transition flex items-center gap-4">
                <div class="bg-purple-100 p-3 rounded-xl"><i data-lucide="star" class="w-6 h-6 text-purple-600"></i></div>
                <div><h3 class="text-gray-500 text-sm">VIP</h3><p class="stat-value font-bold text-2xl">124</p></div>
            </div>
            <div class="stat-card bg-white p-5 rounded-xl shadow-lg hover:scale-105 transition flex items-center gap-4">
                <div class="bg-green-100 p-3 rounded-xl"><i data-lucide="user-check" class="w-6 h-6 text-green-600"></i></div>
                <div><h3 class="text-gray-500 text-sm">Active</h3><p class="stat-value font-bold text-2xl">720</p></div>
            </div>
            <div class="stat-card bg-white p-5 rounded-xl shadow-lg hover:scale-105 transition flex items-center gap-4">
                <div class="bg-blue-100 p-3 rounded-xl"><i data-lucide="user-plus" class="w-6 h-6 text-blue-600"></i></div>
                <div><h3 class="text-gray-500 text-sm">New (Month)</h3><p class="stat-value font-bold text-2xl">46</p></div>
            </div>
        </section>

        <!-- Customers Table -->
        <div class="page-card bg-white rounded-xl shadow-lg p-6">
            <div class="flex items-center gap-2 border-2 border-gray-200 search-wrap rounded-xl px-4 py-2 w-full md:w-72 mb-5 focus-within:border-cyan-400 transition">
                <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                <input type="text" id="custSearch" placeholder="Search customers..." class="outline-none bg-transparent text-sm w-full text-gray-700">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-gray-100">
                            <th class="text-gray-500 font-medium px-3 py-3 text-sm">Customer</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Phone</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Location</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Orders</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Total Spent</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Type</th>
                            <th class="text-gray-500 font-medium py-3 text-sm">Action</th>
                        </tr>
                    </thead>
                    <tbody id="custBody"></tbody>
                </table>
            </div>
            <div class="flex items-center justify-between mt-6">
                <p class="text-sm text-gray-500" id="custInfo"></p>
                <div class="flex gap-2" id="custPagination"></div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const colors = ["bg-cyan-100 text-cyan-700","bg-purple-100 text-purple-700","bg-green-100 text-green-700","bg-orange-100 text-orange-700","bg-pink-100 text-pink-700","bg-blue-100 text-blue-700"];
        const customers = [

            { name:"Shahriar Hossain Alif",   email:"alif@gmail.com",    phone:"+880 1711-111111", location:"Dhaka",      orders:12, spent:"$540",  type:"vip" },
            { name:"Alamin Hossain",    email:"alamin@gmail.com",  phone:"+880 1722-222222", location:"Chittagong", orders:8,  spent:"$320",  type:"regular"},
            { name:"Sadikul Amin Sadman",   email:"sadman@gmail.com",  phone:"+880 1733-333333", location:"Sylhet",     orders:3,  spent:"$95",   type:"new" },
            { name:"Faiyaz Rahman",     email:"faiyaz@gmail.com",    phone:"+880 1744-444444", location:"Dhaka",      orders:20, spent:"$980",  type:"vip" },
            { name:"Shahriar Shifat",   email:"shifat@gmail.com",  phone:"+880 1755-555555", location:"Rajshahi",   orders:6,  spent:"$210",  type:"regular"},
            { name:"Miya Begum",      email:"miy@gmail.com",     phone:"+880 1766-666666", location:"Dhaka",      orders:1,  spent:"$55",   type:"new" },
            { name:"Rafi Islam",     email:"rafi@gmail.com",    phone:"+880 1777-777777", location:"Khulna",     orders:15, spent:"$720",  type:"vip" },
            { name:"Nina Akter",     email:"nina@gmail.com",    phone:"+880 1788-888888", location:"Dhaka",      orders:9,  spent:"$390",  type:"regular"},
            { name:"Omar Faruk",     email:"omar@gmail.com",    phone:"+880 1799-999999", location:"Comilla",    orders:4,  spent:"$145",  type:"regular"},
            { name:"Lily Chowdhury", email:"lily@gmail.com",    phone:"+880 1700-000000", location:"Dhaka",      orders:2,  spent:"$80",   type:"new" },
            { name:"Jakea Rahman",    email:"jake@gmail.com",    phone:"+880 1811-111111", location:"Barishal",   orders:18, spent:"$850",  type:"vip" },
            { name:"Priya Das",      email:"priya@gmail.com",   phone:"+880 1822-222222", location:"Dhaka",      orders:7,  spent:"$260",  type:"regular" },

        ];

        const ROWS = 8;
        let page = 1, search = "";

        function filtered() {
            const q = search.toLowerCase();
            return customers.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.location.toLowerCase().includes(q));
        }

        function render() {
            const data  = filtered();
            const start = (page - 1) * ROWS;
            const slice = data.slice(start, start + ROWS);

            document.getElementById("custBody").innerHTML = slice.map((c, i) => `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="px-3 py-3">
                        <div class="flex items-center gap-3">
                            <div class="avatar ${colors[i % colors.length]}">${c.name[0]}</div>
                            <div>
                                <p class="cust-name font-semibold text-gray-800 text-sm">${c.name}</p>
                                <p class="cust-email text-xs text-gray-500">${c.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-3 text-sm">${c.phone}</td>
                    <td class="py-3 text-sm flex items-center gap-1 mt-3"><i data-lucide="map-pin" class="w-3 h-3 text-gray-400"></i>${c.location}</td>
                    <td class="py-3 text-sm font-medium">${c.orders}</td>
                    <td class="py-3 text-sm font-bold text-green-600">${c.spent}</td>
                    <td class="py-3"><span class="badge badge-${c.type}">${c.type.charAt(0).toUpperCase()+c.type.slice(1)}</span></td>
                    <td class="py-3">
                        <div class="flex gap-2">
                            <button class="text-cyan-600 hover:text-cyan-800"><i data-lucide="eye" class="w-4 h-4"></i></button>
                            <button class="text-gray-400 hover:text-gray-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                            <button class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>
            `).join("");

            const total = data.length;
            const end   = Math.min(start + ROWS, total);
            document.getElementById("custInfo").textContent = total === 0 ? "No customers found" : `Showing ${start+1}–${end} of ${total}`;

            const pages = Math.ceil(total / ROWS);
            const pg    = document.getElementById("custPagination");
            pg.innerHTML = "";
            for (let i = 1; i <= pages; i++) {
                const b = document.createElement("button");
                b.textContent = i;
                b.className = `px-3 py-1.5 rounded-lg border text-sm transition ${i === page ? "bg-cyan-600 text-white border-cyan-600" : "border-gray-200 hover:bg-cyan-600 hover:text-white"}`;
                b.onclick = () => { page = i; render(); };
                pg.appendChild(b);
            }
            lucide.createIcons();
        }

        document.getElementById("custSearch").addEventListener("input", function() { search = this.value; page = 1; render(); });

        const darkModeBtn = document.getElementById("darkModeBtn");
        const darkModeBtnText = document.getElementById("darkModeBtnText");
        darkModeBtn.addEventListener("click", function () {
            const isDark = document.body.classList.toggle("dark");
            const icon = darkModeBtn.querySelector("i");
            darkModeBtnText.textContent = isDark ? "Light Mode" : "Dark Mode";
            icon.setAttribute("data-lucide", isDark ? "sun" : "moon");
            lucide.createIcons();
        });

        render();
    </script>
</body>
</html>
